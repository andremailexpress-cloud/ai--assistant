name: AI Assistant Platform Config
version: 1.1.0
schema: v1

models:
  # 🔹 PRIMARY EXECUTOR (ONLY model allowed to edit/apply)
  - name: Codex Executor
    provider: openai
    model: gpt-4.1
    roles: [chat, edit, apply]

  # 🔹 TASK PREP / STRUCTURE (NO editing rights)
  - name: Qwen Task Prep
    provider: ollama
    model: qwen3-coder:480b-cloud
    roles: [chat]

  # 🔹 AUTOCOMPLETE (lightweight, always on)
  - name: Qwen Autocomplete
    provider: ollama
    model: qwen2.5-coder:1.5b-base
    roles: [autocomplete]

  # 🔹 QC / INTEGRITY GATE (REVIEW ONLY)
  - name: Kimi QC
    provider: openrouter
    model: moonshotai/kimi-k2
    roles: [chat]

  # 🔹 ADJUDICATOR (ONLY when QC flags issues)
  - name: DeepSeek Adjudicator
    provider: openrouter
    model: deepseek/deepseek-r1
    roles: [chat]

  # 🔹 OPTIONAL VALIDATOR (USE SPARINGLY)
  - name: Claude Validator
    provider: anthropic
    model: claude-3-7-sonnet-latest
    roles: [chat]
